<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Loaded Tea Shop — Extra 10% OFF</title>
<style>
  :root{
    --brand-dark:#0b3d2e;
    --brand-mid:#126b4d;
    --brand-light:#1fae7c;
    --accent:#ffce33;
    --accent-2:#ff5c5c;
    --text-on-dark:#ffffff;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #0b1410;
    min-height: 100vh;
  }
  #ltsOverlay{
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(5, 20, 15, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #ltsOverlay.lts-show{
    opacity: 1;
    visibility: visible;
  }
  .lts-card{
    position: relative;
    width: 100%;
    max-width: 460px;
    background-image: linear-gradient(160deg, var(--brand-dark) 0%, var(--brand-mid) 55%, var(--brand-light) 130%);
    background-size: 200% 200%;
    background-position: 0% 50%;
    animation: ltsGradientShift 7s ease infinite;
    border-radius: 22px;
    padding: 34px 26px 28px;
    text-align: center;
    color: var(--text-on-dark);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transform: scale(0.85) translateY(20px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease;
  }
  #ltsOverlay.lts-show .lts-card{
    transform: scale(1) translateY(0);
    opacity: 1;
  }
  @keyframes ltsGradientShift{
    0%{background-position: 0% 50%;}
    50%{background-position: 100% 50%;}
    100%{background-position: 0% 50%;}
  }
  .lts-badge{
    display:inline-block;
    background: var(--accent-2);
    color:#fff;
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
    animation: ltsPulseBadge 1.4s ease-in-out infinite;
  }
  @keyframes ltsPulseBadge{
    0%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255,92,92,0.55); }
    70%{ transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255,92,92,0); }
    100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255,92,92,0); }
  }
  .lts-brand{
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .lts-headline{
    font-size: 30px;
    font-weight: 900;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .lts-headline strong{
    color: var(--accent);
    display:block;
    font-size: 40px;
  }
  .lts-sub{
    font-size: 14px;
    opacity: 0.9;
    margin: 0 0 20px;
    line-height: 1.4;
  }
  .lts-code-wrap{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    background: rgba(255,255,255,0.12);
    border: 2px dashed var(--accent);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    margin-bottom: 16px;
  }
  .lts-code-label{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    display:block;
    text-align:left;
  }
  .lts-code{
    font-family: "Courier New", monospace;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--accent);
    text-align:left;
  }
  .lts-copy-hint{
    font-size: 11px;
    background: rgba(0,0,0,0.25);
    padding: 6px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .lts-cta{
    width: 100%;
    background: var(--accent);
    color: var(--brand-dark);
    border: none;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    margin-bottom: 14px;
  }
  .lts-cta:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.3); }
  .lts-cta:active{ transform: translateY(1px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .lts-cta.lts-copied{ background: #2ecc71; color:#fff; }
  .lts-timer-wrap{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background: rgba(0,0,0,0.28);
    padding: 7px 14px;
    border-radius: 30px;
  }
  .lts-timer-label{
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    opacity: 0.9;
    animation: ltsFlicker 1.8s ease-in-out infinite;
  }
  @keyframes ltsFlicker{
    0%, 100%{ opacity: 0.75; }
    50%{ opacity: 1; }
  }
  .lts-timer{
    display:flex;
    align-items:center;
    gap: 3px;
    font-variant-numeric: tabular-nums;
  }
  .lts-time-box{
    background: var(--accent-2);
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 3px 7px;
    border-radius: 5px;
    min-width: 22px;
    text-align: center;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
  }
  .lts-colon{
    font-weight: 800;
    animation: ltsBlinkColon 1s steps(1) infinite;
  }
  @keyframes ltsBlinkColon{ 50%{ opacity: 0; } }
  .lts-timer-wrap.lts-timer-urgent .lts-time-box{
    background: #ff1e1e;
    animation: ltsUrgentShake 0.5s ease-in-out infinite;
  }
  .lts-timer-wrap.lts-timer-urgent .lts-timer-label{ color: var(--accent-2); }
  @keyframes ltsUrgentShake{
    0%, 100%{ transform: translateX(0); }
    25%{ transform: translateX(-1px); }
    75%{ transform: translateX(1px); }
  }
  .lts-fineprint{
    margin-top: 16px;
    font-size: 10.5px;
    opacity: 0.65;
  }
  /* ---------- Mobile: true edge-to-edge fullscreen ---------- */
  @media (max-width: 600px){
    #ltsOverlay{ padding: 0; }
    .lts-card{
      max-width: 100%;
      width: 100%;
      height: 100%;
      border-radius: 0;
      display:flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px;
    }
    .lts-headline{ font-size: 26px; }
    .lts-headline strong{ font-size: 34px; }
    .lts-code{ font-size: 19px; }
  }
</style>
</head>
<body>
<!-- ================= FULLSCREEN OVERLAY MARKUP ================= -->
<div id="ltsOverlay" role="dialog" aria-modal="true" aria-label="Coupon offer">
  <div class="lts-card">
    <span class="lts-badge">⚡ Flash Deal — Just For You</span>
    <div class="lts-brand">The Loaded Tea Shop</div>
    <h2 class="lts-headline">Unlock<strong>Extra 10% OFF</strong></h2>
    <p class="lts-sub">Apply your code at checkout and save instantly on your order.</p>
    <div class="lts-code-wrap" id="ltsCodeWrap" title="Click to copy">
      <div>
        <span class="lts-code-label">Your Code</span>
        <span class="lts-code" id="ltsCodeText">RAYNA90612</span>
      </div>
      <span class="lts-copy-hint">Tap to copy</span>
    </div>
    <button class="lts-cta" id="ltsCtaBtn">Copy Code &amp; Shop Now</button>
    <div class="lts-timer-wrap" id="ltsTimerWrap">
      <span class="lts-timer-label">⏰ Offer ends in</span>
      <span class="lts-timer">
        <span class="lts-time-box" id="ltsMin">15</span><span class="lts-colon">:</span><span class="lts-time-box" id="ltsSec">00</span>
      </span>
    </div>
    <p class="lts-fineprint">One-time use per customer. Discount applied at checkout.</p>
  </div>
</div>
<script>
(function () {
  "use strict";
  /* ================= CONFIG ================= */
  var CONFIG = {
    couponCode: "RAYNA90612",
    brandName: "The Loaded Tea Shop",
    discountText: "Extra 10% OFF",
    redirectUrl: "https://www.theloadedteashop.com/RAYNA90612",
    // How long (ms) to show "Copied!" before redirecting
    redirectDelayMs: 700,
    // Countdown timer (creates urgency/curiosity). Set to null to hide.
    countdownMinutes: 15,
    // Open the client page in a new tab instead of same tab
    openInNewTab: true,
    // Delay (ms) after page load before the popup appears
    openDelayMs: 800,
    // If true, once a visitor closes the popup it won't reopen again
    // during the same browser tab session (uses sessionStorage).
    dontShowAgainThisSession: true
  };
  /* ============================================ */
  var overlay   = document.getElementById("ltsOverlay");
  var ctaBtn    = document.getElementById("ltsCtaBtn");
  var codeWrap  = document.getElementById("ltsCodeWrap");
  var timerWrap = document.getElementById("ltsTimerWrap");
  var minEl     = document.getElementById("ltsMin");
  var secEl     = document.getElementById("ltsSec");
  var SESSION_KEY = "lts_coupon_popup_closed";
  function alreadyClosedThisSession() {
    try {
      return CONFIG.dontShowAgainThisSession && sessionStorage.getItem(SESSION_KEY) === "1";
    } catch (e) {
      return false;
    }
  }
  function markClosed() {
    try {
      if (CONFIG.dontShowAgainThisSession) sessionStorage.setItem(SESSION_KEY, "1");
    } catch (e) {}
  }
  // Open the popup a moment after page load
  window.addEventListener("load", function () {
    if (alreadyClosedThisSession()) return;
    setTimeout(function () {
      overlay.classList.add("lts-show");
      document.documentElement.style.overflow = "hidden"; // lock background scroll
    }, CONFIG.openDelayMs);
  });
  function closeOverlay() {
    overlay.classList.remove("lts-show");
    document.documentElement.style.overflow = "";
    markClosed();
  }
  function copyCode() {
    var code = CONFIG.couponCode;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      var tmp = document.createElement("textarea");
      tmp.value = code;
      tmp.style.position = "fixed";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(tmp);
    }
  }
  function goToClientPage() {
    if (!CONFIG.redirectUrl) return;
    if (CONFIG.openInNewTab) {
      window.open(CONFIG.redirectUrl, "_blank", "noopener");
    } else {
      window.location.href = CONFIG.redirectUrl;
    }
  }
  function handleClaim() {
    copyCode();
    ctaBtn.textContent = "Copied! Redirecting…";
    ctaBtn.classList.add("lts-copied");
    setTimeout(function () {
      goToClientPage();
      setTimeout(function () {
        ctaBtn.textContent = "Copy Code & Shop Now";
        ctaBtn.classList.remove("lts-copied");
      }, 1500);
    }, CONFIG.redirectDelayMs);
  }
  ctaBtn.addEventListener("click", handleClaim);
  codeWrap.addEventListener("click", handleClaim);
  // ---------------- Countdown timer (creates curiosity + urgency) ----------------
  if (CONFIG.countdownMinutes && minEl && secEl) {
    var totalSeconds = CONFIG.countdownMinutes * 60;
    function render() {
      var m = Math.floor(totalSeconds / 60);
      var s = totalSeconds % 60;
      minEl.textContent = m < 10 ? "0" + m : m;
      secEl.textContent = s < 10 ? "0" + s : s;
      if (timerWrap) timerWrap.classList.toggle("lts-timer-urgent", totalSeconds <= 60);
    }
    render();
    setInterval(function () {
      totalSeconds--;
      if (totalSeconds < 0) totalSeconds = CONFIG.countdownMinutes * 60;
      render();
    }, 1000);
  } else if (timerWrap) {
    timerWrap.style.display = "none";
  }
})();
</script>
</body>
</html>
